<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats preview card component</title>
    <link rel="stylesheet" href="stylesheet/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="webpage">
        <section class="container-card">
            <div class="leftSide-content">
                <div class="title-block">
                    <h2>Get <span class="insight-text">insights</span> that help <br>your business grow.</h2>
                    <p>Discover the benefits of data analtics & make better decisions regarding revenue, customer experience & overall efficiency </p>
                </div>

                <div class="counter-details">
                    <div>
                        <span><h3>10k+</h3></span>
                        <p>COMAPNIES</p>
                    </div>

                     <div>
                        <span><h3>314+</h3></span>
                        <p>TEMPLATES</p>
                    </div>

                     <div>
                        <span><h3>12M+</h3></span>
                        <p>QUERIES</p>
                    </div>
                </div>
            </div>

            <!-- Enquiry Form Details -->

            <aside class="sideEnquiry">
                <div>
                    <h3>Enquiry Form</h3>
                </div>

                <div class="form-enquiry">
                    <div>
                        <label for="username">Username</label> <br>
                        <input type="text" id="username" placeholder="Enter your name..." name="username" class="style-username">
                    </div>

                    <div>
                        <label for="email">Email</label> <br>
                        <input type="email" id="email" placeholder="Enter dyour email..." name="email">
                    </div>

                    <div>
                        <label for="phone number">Phone Number</label> <br>
                        <input type="tel" id="phone number" placeholder="enter your phone number..." name="phone number">
                    </div>

                    <div>
                        <label for="gender">Gender</label> <br>
                        <input type="radio" id="male" name="gender"> <label for="male">Male</label>
                        <input type="radio" id="female" name="gender"> <label for="female">Female</label>
                    </div>

                    <div>
                        <label for="expertise">Choose Expertise</label> <br>
                        <input type="checkbox" id="HTML" name="expertise"> <label for="HTML">HTML</label>
                        <input type="checkbox" id="css" name="expertise"> <label for="css">CSS</label>
                        <input type="checkbox" id="js" name="expertise"> <label for="js">Js</label>
                        <input type="checkbox" id="boostrap" name="expertise" disabled> <label for="boostrap">Boostrap</label>
                    </div>

                    <button>Submit</button>
                </div>
            </aside>
        </section>
    </main>
</body>
</html>
