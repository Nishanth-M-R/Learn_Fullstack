<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results summary component</title>
    <link rel="stylesheet" href="/stylesheet/style.css">
</head>
<body class="summary-component">
   <div class="container">
    <div class="result-card">
        <h3 class="result-text">Your Result</h3>
        <span class="circle">
            <h2>76</h2>
            <p>of 100</p>
        </span>
        <h3 class="headline">Great</h3>
        <p>Your second higher than 75% of the people who takken these tests.</p>
    </div>

    <div class="summary-part">
        <h3>Summary</h3>
        <span class="react-line">
            <h4>⚡Reaction</h4>
            <p> <b>80</b> / 100</p>
        </span>

        <span class="memory-line">
            <h4>🧠 Memory</h4>
            <p> <b>92</b> / 100</p>
        </span>

        <span class="verbal-line">
            <h4>💬 Verbal</h4>
            <p> <b>89</b> / 100</p>
        </span>

        <span class="visual-line">
            <h4>👁️ Visual</h4>
            <p> <b>73</b> / 100</p>
        </span>

        <button class="btn-continue">Continue</button>

    </div>
   </div>
</body>
</html>
